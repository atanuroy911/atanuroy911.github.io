{% include base_path %}

<meta charset="utf-8">

{% include seo.html %}

<link href="{% if site.atom_feed.path %}{{ site.atom_feed.path }}{% else %}{{ base_path }}/feed.xml{% endif %}" type="application/atom+xml" rel="alternate" title="{{ site.title }} Feed">

<!-- http://t.co/dKP3o1e -->
<meta name="HandheldFriendly" content="True">
<meta name="MobileOptimized" content="320">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script>
  document.documentElement.className = document.documentElement.className.replace(/\bno-js\b/g, '') + ' js ';
</script>

<!-- For all browsers -->
<link rel="stylesheet" href="{{ base_path }}/assets/css/main.css">

<script>
  (function () {
    var redirectTarget = "https://atanusroy.com{{ page.url | replace: 'index.html', '' }}";
    var userAgent = (navigator.userAgent || "") + " " + ((navigator.userAgentData && navigator.userAgentData.brands && navigator.userAgentData.brands.map) ? navigator.userAgentData.brands.map(function (brand) { return brand.brand; }).join(" ") : "");
    var crawlerPattern = /(bot|crawler|spider|slurp|preview|headless|lighthouse|wget|curl|python-requests|httpclient|aiohttp|scrapy|feedfetcher|facebookexternalhit|linkedinbot|ia_archiver|GPTBot|Google-Extended|PerplexityBot|ClaudeBot|CCBot|Bytespider|Amazonbot|OAI-SearchBot|ChatGPT-User|SemrushBot|AhrefsBot)/i;

    if (crawlerPattern.test(userAgent)) {
      window.location.replace(redirectTarget);
    }
  }());
</script>

<meta http-equiv="cleartype" content="on">
